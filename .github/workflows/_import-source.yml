name: Materialize verified showcase source
on:
  push:
    branches: [main]
    paths: ['.bootstrap-payload/**', '.github/workflows/_import-source.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: materialize-showcase
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve the exact qualified dependency lock
        uses: actions/download-artifact@v4
        with:
          name: component-toolchain
          run-id: 36262941953
          github-token: ${{ github.token }}
          path: .bootstrap-toolchain
      - name: Verify transfer and restore readable source files
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {createHash} from 'node:crypto';
          import {brotliDecompressSync} from 'node:zlib';
          const names=fs.readdirSync('.bootstrap-payload').sort();
          if(names.length!==6)throw new Error('Incomplete source transfer');
          const bytes=Buffer.from(names.map(n=>fs.readFileSync('.bootstrap-payload/'+n,'utf8').trim()).join(''),'base64');
          if(createHash('sha256').update(bytes).digest('hex')!=='8ae484c8e2d797a7a1605efd20d6c0bc1a532da60b1f7d73ec302599c4e408ba')throw new Error('Source checksum mismatch');
          const files=JSON.parse(brotliDecompressSync(bytes,{maxOutputLength:1000000}).toString('utf8'));
          if(Object.keys(files).length!==22)throw new Error('Unexpected file count');
          for(const [name,content] of Object.entries(files)){
            if(typeof content!=='string'||name.includes('..')||name.includes('\\')||path.isAbsolute(name)||name.startsWith('.github/')||name.startsWith('.git/'))throw new Error('Invalid source path');
            fs.mkdirSync(path.dirname(name),{recursive:true});
            fs.writeFileSync(name,content,'utf8');
            console.log('Restored',name);
          }
          NODE
          tar -xOf .bootstrap-toolchain/toolchain.tar.gz toolchain/package-lock.json > .bootstrap-lock.json
          python3 <<'PY'
          import json, hashlib
          from pathlib import Path
          lock=json.loads(Path('.bootstrap-lock.json').read_text())
          pkg=json.loads(Path('package.json').read_text())
          lock['name']=pkg['name']
          lock['version']=pkg['version']
          lock['packages']['']['name']=pkg['name']
          lock['packages']['']['license']=pkg['license']
          lock['packages']['']['engines']=pkg['engines']
          data=(json.dumps(lock,indent=2)+'\n').encode()
          assert hashlib.sha256(data).hexdigest()=='ce366400aac6ef4021faea9d2fb949584b3573cbdfe82a1ac2b92c6532ba6b05','Lock checksum mismatch'
          Path('package-lock.json').write_bytes(data)
          print('Qualified package-lock.json verified')
          PY
          rm -rf .bootstrap-toolchain .bootstrap-payload .bootstrap-lock.json
      - name: Commit the complete plain-text source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'feat: launch WebComponents studio with eleven real-package playgrounds and 57 generated pages'
          git push origin HEAD:main
